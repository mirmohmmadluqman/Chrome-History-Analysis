<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChronosAnalytics</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>ChronosAnalytics</span>
      </div>
    </header>
    
    <main>
      <div class="card summary-card">
        <div class="label">Active Today</div>
        <div class="value" id="today-time">0h 0m</div>
      </div>
      
      <div class="card focus-card">
        <div class="label">Focus Score</div>
        <div class="value" id="focus-score">0%</div>
        <div class="progress-bar">
          <div class="progress-fill" id="focus-fill" style="width: 0%"></div>
        </div>
      </div>
      
      <div class="top-site">
        <span class="label">Top Focus:</span>
        <span class="site-name" id="top-domain">Loading...</span>
      </div>
    </main>

    <footer>
      <button id="btn-dashboard" class="primary-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        Open Dashboard
      </button>
    </footer>
  </div>
  
  <script type="module" src="popup.js"></script>
</body>
</html>
